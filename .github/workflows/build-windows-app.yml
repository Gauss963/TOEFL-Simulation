name: Build Windows App

# The Windows app lives in windows/ and shares the Mac app's resources and version number.
# Every push builds both architectures, packs them into one Setup.exe, installs it on a Windows
# runner, and smoke-tests the installed app. A version tag also attaches the Setup.exe to that
# version's GitHub release (the same release as the Mac app).
on:
  push:
    branches:
      - main
      - windows
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows app (${{ matrix.arch }})
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Run core tests
        if: matrix.arch == 'x64'
        working-directory: windows
        run: dotnet test --project tests/TOEFLSimulation.Core.Tests -c Release

      - name: Publish self-contained app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $platform = if ('${{ matrix.arch }}' -eq 'arm64') { 'ARM64' } else { 'x64' }
          $out = Join-Path $env:RUNNER_TEMP 'publish'
          dotnet publish windows/src/TOEFLSimulation.App/TOEFLSimulation.App.csproj `
            -c Release -r win-${{ matrix.arch }} -p:Platform=$platform -o $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($file in 'TOEFLSimulation.exe', 'TOEFLSimulation.pri', 'Resources/TOEFL2026Bank.json', 'Resources/ExamAudio.pack', 'Resources/WordPronunciations.pack') {
            if (-not (Test-Path (Join-Path $out $file))) { throw "Missing $file in the published app" }
          }

      - name: Upload published app
        uses: actions/upload-artifact@v7
        with:
          name: publish-${{ matrix.arch }}
          path: ${{ runner.temp }}/publish
          if-no-files-found: error
          retention-days: 3

  installer:
    name: Setup.exe, install, and smoke test
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download both builds
        uses: actions/download-artifact@v8
        with:
          pattern: publish-*
          path: ${{ runner.temp }}

      - name: Add the offline speech model (Whisper base.en, MIT license)
        shell: pwsh
        run: |
          $models = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'publish-x64/Models')
          $model = Join-Path $models 'ggml-base.en-q5_1.bin'
          Invoke-WebRequest -Uri 'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en-q5_1.bin' -OutFile $model
          $modelHash = (Get-FileHash $model -Algorithm SHA256).Hash.ToLower()
          if ($modelHash -ne '4baf70dd0d7c4247ba2b81fafd9c01005ac77c2f9ef064e00dcf195d0e2fdd2f') { throw "Unexpected Whisper model hash $modelHash" }

      - name: Build Setup.exe
        id: setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pbx = Get-Content -Raw 'TOEFL Simulation.xcodeproj/project.pbxproj'
          $version = [regex]::Match($pbx, 'MARKETING_VERSION = ([0-9.]+);').Groups[1].Value
          Rename-Item (Join-Path $env:RUNNER_TEMP 'publish-x64') 'x64'
          Rename-Item (Join-Path $env:RUNNER_TEMP 'publish-arm64') 'arm64'
          $output = Join-Path $env:RUNNER_TEMP 'installer'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$version" "/DX64Dir=$env:RUNNER_TEMP\x64" "/DArm64Dir=$env:RUNNER_TEMP\arm64" "/DOutputDir=$output" windows/installer/Setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setupName = "TOEFL-Simulation-$version-Windows-Setup.exe"
          $setup = Join-Path $output $setupName
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  $setupName" | Set-Content -Encoding ascii (Join-Path $output "TOEFL-Simulation-$version-Windows-Setup-SHA256.txt")
          "{0:N0} MB  $setupName" -f ((Get-Item $setup).Length / 1MB)
          "version=$version" >> $env:GITHUB_OUTPUT
          "setup=$setup" >> $env:GITHUB_OUTPUT

      - name: Upload Setup.exe
        uses: actions/upload-artifact@v7
        with:
          name: TOEFL-Simulation-${{ steps.setup.outputs.version }}-Windows-Setup
          path: ${{ runner.temp }}/installer/*
          if-no-files-found: error
          retention-days: 14

      - name: Install silently and smoke-test the installed app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $install = Start-Process -FilePath '${{ steps.setup.outputs.setup }}' -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER' -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Setup exited with $($install.ExitCode)" }
          $appDir = Join-Path $env:LOCALAPPDATA 'Programs/TOEFL Simulation'
          $exe = Join-Path $appDir 'TOEFLSimulation.exe'
          if (-not (Test-Path $exe)) { throw "Not installed at $exe" }
          $startMenu = Join-Path $env:APPDATA 'Microsoft/Windows/Start Menu/Programs/TOEFL Simulation/TOEFL Simulation.lnk'
          if (-not (Test-Path $startMenu)) { throw 'Start menu shortcut missing' }
          $out = Join-Path $env:RUNNER_TEMP 'smoke'
          $process = Start-Process -FilePath $exe -ArgumentList @('--smoke-test', "`"$out`"") -PassThru
          $null = $process.Handle
          if (-not $process.WaitForExit(1200000)) { $process.Kill(); throw 'Smoke test timed out' }
          Get-Content (Join-Path $out 'smoke.log') -ErrorAction SilentlyContinue | Select-String -Pattern '^(FAIL|SMOKE)' | ForEach-Object { $_.Line }
          $crash = Join-Path $env:LOCALAPPDATA 'TOEFL Simulation/crash.log'
          if (Test-Path $crash) { Copy-Item $crash $out; Get-Content $crash | Select-Object -First 60 }
          if ($process.ExitCode -ne 0) { throw "Smoke test failed (exit code $($process.ExitCode))" }

      - name: Uninstall check (progress is kept)
        shell: pwsh
        run: |
          $appDir = Join-Path $env:LOCALAPPDATA 'Programs/TOEFL Simulation'
          $uninstall = Start-Process -FilePath (Join-Path $appDir 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru -Wait
          Start-Sleep -Seconds 5
          if (Test-Path (Join-Path $appDir 'TOEFLSimulation.exe')) { throw 'Uninstall left the app behind' }
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'TOEFL Simulation'))) { throw 'Uninstall removed saved progress' }
          'Uninstalled; saved progress kept.'

      - name: Upload smoke-test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-${{ github.run_number }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore
          retention-days: 7

      - name: Attach Setup.exe to the version's release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          # The Mac release is published right after the tag is pushed; wait for it.
          for ($i = 0; $i -lt 60; $i++) {
            gh release view $tag --repo '${{ github.repository }}' *> $null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 30
          }
          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -ne 0) { throw "Release $tag was not found." }
          gh release upload $tag --repo '${{ github.repository }}' --clobber (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'installer/*')).FullName
